<!doctype html>
<html lang="eo">

<head>
  <meta charset="utf-8">
  <title>CCX JWT</title>

  <meta name="description" content="Afero">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="rgb(118, 145, 158)">

  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; }
    #ccx { flex: 1; width: 100%; border: 1px solid rgb(118, 145, 158); }
  </style>
</head>

<body>

  <form id="login-form" method="post" action="/login-to-ccx">
    <p><input type="text" name="userid" placeholder="user-id" required> (pretend that the user is already logged in with this ID)</p>
    <p><input type="text" name="name1" placeholder="user-firstname"></p>
    <p><input type="text" name="name2" placeholder="user-lastname"></p>
    <p><input type="text" name="orgid" placeholder="org-id"> (optional; adds an "org" claim to the JWT)</p>
    <p><input type="text" name="orgname" placeholder="org-name"></p>
    <p><input type="text" name="orgrole" placeholder="org-role"></p>
    <p>
      <button type="submit">login (redirect)</button>
      <button type="button" id="iframe-login">login (iframe)</button>
      <button type="button" id="newtab-login">login (new tab)</button>
    </p>
  </form>

  <iframe id="ccx" title="CCX user interface"></iframe>

  <script>
    document.getElementById('iframe-login').addEventListener('click', async () => {
      const form = document.getElementById('login-form');
      if (!form.reportValidity()) {
        return;
      }

      const resp = await fetch('/embed-ccx', {
        method: 'POST',
        body: new URLSearchParams(new FormData(form)),
      });
      if (!resp.ok) {
        alert(await resp.text());
        return;
      }

      const { url } = await resp.json();
      document.getElementById('ccx').src = url;
    });

    document.getElementById('newtab-login').addEventListener('click', () => {
      const form = document.getElementById('login-form');
      if (!form.reportValidity()) {
        return;
      }

      // submit as a top-level navigation (like the redirect flow), but into
      // a new tab/window, so the session cookie is still accepted with the
      // browser's default SameSite=Lax
      form.target = '_blank';
      form.requestSubmit();
      form.target = '';
    });
  </script>

</body>

</html>
